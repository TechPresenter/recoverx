    <meta charset="UTF-8" />

    <title>RecoverX</title>

      The Content Security Policy is injected as a response header by the main
      process (src/main/security/session-hardening.ts) rather than declared here.
      A header cannot be stripped by a compromised document, and it also covers
      workers and subresources that a <meta> tag would not.
    -->
  </head>

    <script type="module" src="./main.tsx"></script>
  </body>
